version: lstm_feasibility_v1
baseline_window_days: 30
candidate_windows_days: [14, 30, 60, 90]
minimum_history_days: [1, 3, 7]
analysis_splits: [train, validation, test]

sequence_keys:
  - name: food_group_l2
    label: 식품군 소분류
    columns: [sequence_food_group_l2]
  - name: product_name
    label: 정제 품목명
    columns: [sequence_product_name]
  - name: food_group_l2_province
    label: 식품군 소분류×수거 시도
    columns: [sequence_food_group_l2, sequence_collection_province]

weather:
  readiness_column: weather_join_ready_v1
  location_column: domestic_province_std
  actual_weather_file_present: false

policy:
  inspection_history_sequence:
    - 직전일까지의 동일 식품군 검사 건수
    - 검사 실시일 간격과 관측 유무 마스크
  future_weather_sequence:
    - 일평균·최고·최저기온
    - 강수량·상대습도
    - 향후 확보 시 검사일 직전 window만 사용
  forbidden_sequence_inputs:
    - 현재 검사 결과값·판정값·MRL·목표라벨
    - 검사일 이후의 모든 정보
    - 결과 확정시각이 없는 과거 판정값과 과거 목표라벨
