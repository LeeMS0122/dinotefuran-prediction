project:
  hazard: 디노테퓨란
  master_version: v2.3
  grain: 검사 결과 1건
  primary_key: record_id

data:
  env_key: DINO_EDA_DATA_PATH
  cache_file: output/eda/cache/analysis.parquet
  date_column: event_date

targets:
  occurrence:
    column: label_occurrence_v1
    name: 잔류 발생
    purpose: 잔류 검출 특성 분석
  screening:
    column: label_screening_10pct_v1
    name: MRL 10% 초과 관심농도
    purpose: 검사 우선순위 및 조기경보
  noncompliance:
    column: label_noncompliance_v1
    name: 기준 부적합
    purpose: 기준 위반 위험 분석

segments:
  - source_system
  - product_name_std
  - product_group_raw
  - origin_country_name
  - collection_province

eda:
  min_group_n: 30
  top_n: 15
  latest_year_is_partial: true
  latest_year: 2026
  random_seed: 42
